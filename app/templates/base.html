<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}ReparaCampus{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <header class="barra">
    <a class="marca" href="{{ url_for('inicio') }}">ReparaCampus</a>
    {% if g.usuario %}
    <nav>
      {% if g.usuario['rol'] == 'COORDINADOR' %}
      <a href="{{ url_for('tablero.ver') }}">Tablero</a>
      {% endif %}
      <a href="{{ url_for('incidencias.listado') }}">Incidencias</a>
      {% if g.usuario['rol'] == 'SOLICITANTE' %}
      <a href="{{ url_for('incidencias.nueva') }}">Nueva incidencia</a>
      {% endif %}
    </nav>
    <div class="sesion">
      <span>{{ g.usuario['nombre'] }} · {{ g.usuario['rol'] }}</span>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <button type="submit" class="secundario">Cerrar sesión</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
