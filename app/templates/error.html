{% extends "base.html" %}
{% block titulo %}Error {{ error.codigo_http }} · ReparaCampus{% endblock %}
{% block contenido %}
<section class="tarjeta estrecha">
  <h1>No se pudo completar la operación</h1>
  <p class="error" role="alert">{{ error.mensaje }}</p>
  <p class="nota">Código {{ error.codigo_http }}. No se modificó ningún dato.</p>
  <p><a href="{{ url_for('inicio') }}">Volver al inicio</a></p>
</section>
{% endblock %}
