{% extends "base.html" %}
{% block titulo %}Iniciar sesión · ReparaCampus{% endblock %}
{% block contenido %}
<section class="tarjeta estrecha">
  <h1>Iniciar sesión</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" autocomplete="username" required autofocus>
    <label for="clave">Contraseña</label>
    <input id="clave" name="clave" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>
  <p class="nota">Prototipo con cuentas ficticias. Las credenciales están en el README.</p>
</section>
{% endblock %}
